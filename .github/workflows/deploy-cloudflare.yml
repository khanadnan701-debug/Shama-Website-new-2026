name: Deploy Shama Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shama-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare minimal production bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets/frozen
          cp index.html dist/
          cp styles.css logo.css modern.css fix.css showcase.css showcase-fix.css flavour-map.css header-studio.css cart-studio.css mobile-stability.css dist/
          cp landing.js dist/
          cp assets/shama-logo.png dist/assets/
          cp assets/frozen/shama-crispy-paratha-20.webp dist/assets/frozen/

      - name: Build Shama favicon
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          elif command -v convert >/dev/null 2>&1; then
            convert assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          else
            cp assets/shama-logo.png dist/favicon.png
          fi

      - name: Verify production bundle
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/landing.js
          test -s dist/mobile-stability.css
          test -s dist/assets/shama-logo.png
          test -s dist/assets/frozen/shama-crispy-paratha-20.webp
          ! test -e dist/script.js
          ! test -e dist/category-videos.js
          ! test -e dist/about.html
          ! test -e dist/catalogue.html
          echo "Production bundle is a single stable landing page."

      - name: Verify Cloudflare account
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: whoami

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: deploy

# One production build at a time. Older in-flight builds are cancelled automatically.
