name: Deploy Shama Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shama-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Current stable homepage runtime.
          cp index.html landing.js mobile-stability.css dist/
          cp styles.css logo.css modern.css fix.css showcase.css showcase-fix.css flavour-map.css header-studio.css cart-studio.css dist/

          # Restored multi-page runtime.
          cp about.html catalogue.html contact.html rice.html spices.html sauces-pastes.html miscellaneous.html beverages.html flour-lentiles.html frozen.html oils.html dry-fruits.html dist/
          cp script.js about-studio.css catalogue-studio.css category-studio.css contact-studio.css trade-picker.css product-runway.css product-simple.css product-zoom.css frozen-images.css dist/
          cp flour-images.js frozen-images.js product-simple.js dist/

          # Product/page assets are shared by the restored pages.
          cp -R assets dist/assets

      - name: Build Shama favicon
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          elif command -v convert >/dev/null 2>&1; then
            convert assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          else
            cp assets/shama-logo.png dist/favicon.png
          fi

      - name: Verify production bundle
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/landing.js
          test -s dist/mobile-stability.css
          test -s dist/script.js
          test -s dist/about.html
          test -s dist/catalogue.html
          test -s dist/contact.html
          test -s dist/rice.html
          test -s dist/spices.html
          test -s dist/sauces-pastes.html
          test -s dist/miscellaneous.html
          test -s dist/beverages.html
          test -s dist/flour-lentiles.html
          test -s dist/frozen.html
          test -s dist/oils.html
          test -s dist/dry-fruits.html
          test -s dist/assets/shama-logo.png
          ! test -e dist/category-videos.js
          ! test -e dist/category-videos.css
          ! test -e dist/home-flavour-v2.js
          ! test -e dist/home-flavour-v2.css
          echo "Production bundle contains the stable homepage plus restored website pages."

      - name: Verify Cloudflare account
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: whoami

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: deploy

# One production build at a time. Older in-flight builds are cancelled automatically.
