name: Deploy Shama Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='wrangler.jsonc' \
            --exclude='worker.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

      - name: Build Shama favicon
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          elif command -v convert >/dev/null 2>&1; then
            convert assets/shama-logo.png -background none -gravity center -resize 58x58 -extent 64x64 dist/favicon.png
          else
            cp assets/shama-logo.png dist/favicon.png
          fi

      - name: Verify Cloudflare account
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: whoami

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.130.0'
          command: deploy

# Deploys static assets plus the same-origin category video proxy.
