<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laziza | Shama International</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=20260915-1"><link rel="shortcut icon" type="image/png" href="favicon.png?v=20260915-1"><link rel="apple-touch-icon" href="favicon.png?v=20260915-1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>
.laziza-filter-panel{max-width:1180px;margin:0 auto 34px;padding:0 24px}.laziza-filter-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.laziza-filter-head h2{margin:0;color:#152039;font:800 clamp(24px,3vw,36px)/1.1 Manrope,sans-serif}.laziza-filter-count{color:#69738b;font:700 13px/1.4 DM Sans,sans-serif}.laziza-filter-row{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start;padding:14px 0;border-top:1px solid #e8ebf2}.laziza-filter-row:first-of-type{border-top:0}.laziza-filter-label{padding-top:10px;color:#8a93a8;font:800 11px/1 DM Sans,sans-serif;letter-spacing:.12em;text-transform:uppercase}.laziza-filter-buttons{display:flex;gap:9px;flex-wrap:wrap}.laziza-filter button{border:1px solid #d7ddea;background:#fff;color:#152039;border-radius:999px;padding:10px 15px;font:700 13px/1 DM Sans,sans-serif;cursor:pointer;transition:.2s}.laziza-filter button:hover{border-color:#152039;transform:translateY(-1px)}.laziza-filter button.active{background:#152039;color:#fff;border-color:#152039}.laziza-family-btn{font-weight:800!important}.laziza-all-row{margin-bottom:8px}.laziza-all-row button{padding:11px 20px}.simple-product-card[hidden]{display:none!important}@media(max-width:700px){.laziza-filter-head{align-items:start;flex-direction:column}.laziza-filter-row{grid-template-columns:1fr;gap:8px}.laziza-filter-label{padding-top:0}}
</style><link id="shama-product-details-css" rel="stylesheet" href="product-details-20260922.css?v=20260922-clickfix3"></head><body data-page="product" data-category="laziza"><div id="site-header"></div><main id="page-content"></main><div id="site-footer"></div><script src="script.js?v=20260721-16"></script><script src="brand-categories-20260912.js?v=20260922-ranges1"></script><script src="laziza-products-20260917.js?v=20260917-2"></script><script src="product-simple.js?v=20260922-all-details4"></script><script>
(() => {
  function mountLazizaFilters(){
    if(document.body.dataset.category!=='laziza')return;
    const section=document.querySelector('.simple-catalogue');
    const grid=document.querySelector('#simple-product-grid');
    const data=window.lazizaCatalogue;
    if(!section||!grid||!data)return;

    if(!document.querySelector('.laziza-filter-panel')){
      const panel=document.createElement('div');
      panel.className='laziza-filter-panel laziza-filter';
      panel.innerHTML=`
        <div class="laziza-filter-head"><h2>Browse Laziza by category</h2><div class="laziza-filter-count"><span data-visible-count>${data.total}</span> products</div></div>
        <div class="laziza-all-row"><button class="active" data-filter-kind="all" data-filter="all">All Products (${data.total})</button></div>
        <div class="laziza-filter-row">
          <div class="laziza-filter-label">Spices</div>
          <div class="laziza-filter-buttons">
            <button class="laziza-family-btn" data-filter-kind="family" data-filter="spices">All Spices (${data.spices})</button>
            <button data-filter-kind="type" data-filter="biryani-pulao">Biryani & Pulao (${data.groups['biryani-pulao'].count})</button>
            <button data-filter-kind="type" data-filter="kebab-bbq">Kebab & BBQ (${data.groups['kebab-bbq'].count})</button>
            <button data-filter-kind="type" data-filter="curry-meat">Curry & Meat (${data.groups['curry-meat'].count})</button>
            <button data-filter-kind="type" data-filter="traditional-spices">Haleem, Nihari & Paya (${data.groups['traditional-spices'].count})</button>
            <button data-filter-kind="type" data-filter="snacks-sides">Snacks, Chaat & Sides (${data.groups['snacks-sides'].count})</button>
          </div>
        </div>
        <div class="laziza-filter-row">
          <div class="laziza-filter-label">Sweets</div>
          <div class="laziza-filter-buttons">
            <button class="laziza-family-btn" data-filter-kind="family" data-filter="sweets">All Sweets (${data.sweets})</button>
            <button data-filter-kind="type" data-filter="custard">Custard (${data.groups.custard.count})</button>
            <button data-filter-kind="type" data-filter="jelly">Jelly (${data.groups.jelly.count})</button>
            <button data-filter-kind="type" data-filter="falooda">Falooda (${data.groups.falooda.count})</button>
            <button data-filter-kind="type" data-filter="kheer-firni">Kheer & Firni (${data.groups['kheer-firni'].count})</button>
            <button data-filter-kind="type" data-filter="kulfi">Kulfi (${data.groups.kulfi.count})</button>
            <button data-filter-kind="type" data-filter="halwa">Halwa (${data.groups.halwa.count})</button>
          </div>
        </div>`;
      section.prepend(panel);

      panel.addEventListener('click',e=>{
        const btn=e.target.closest('button[data-filter]');
        if(!btn)return;
        panel.querySelectorAll('button[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));
        const kind=btn.dataset.filterKind;
        const value=btn.dataset.filter;
        let visible=0;
        grid.querySelectorAll('.simple-product-card').forEach(card=>{
          const title=card.querySelector('h3')?.textContent||'';
          const meta=data.titleMeta?.[title];
          const show=kind==='all'||(kind==='family'&&meta?.family===value)||(kind==='type'&&meta?.type===value);
          card.hidden=!show;
          if(show)visible++;
        });
        const count=panel.querySelector('[data-visible-count]');
        if(count)count.textContent=visible;
      });
    }

    grid.querySelectorAll('.simple-product-card').forEach(card=>{
      const title=card.querySelector('h3')?.textContent||'';
      const meta=data.titleMeta?.[title];
      const label=card.querySelector('.simple-product-meta');
      if(meta&&label)label.textContent=`Laziza · ${meta.typeLabel}`;
    });
  }

  document.addEventListener('shama:product-simple-rendered',mountLazizaFilters);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mountLazizaFilters,{once:true});
  else mountLazizaFilters();
})();
</script><script src="category-product-hero-video.js?v=20260912-nav4"></script><script src="translation.js?v=20260909-safe1" defer></script><script id="shama-product-details-js" src="product-details-20260922.js?v=20260922-clickfix3"></script></body></html>
