<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oils | Shama</title><link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=20260915-1"><link rel="shortcut icon" type="image/png" href="favicon.png?v=20260915-1"><link rel="apple-touch-icon" href="favicon.png?v=20260915-1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260915-oils2"><link rel="stylesheet" href="rice-category-groups-20260924.css?v=20260924-3"><link id="shama-product-details-css" rel="stylesheet" href="product-details-20260922.css?v=20260922-clickfix3"></head><body data-page="product" data-category="oils"><div id="site-header"></div><main id="page-content"></main><div id="site-footer"></div><script src="script.js?v=20260929-oils1"></script><script src="oils-products-20260915.js?v=20260929-oils1"></script><script src="product-simple.js?v=20260922-all-details4"></script><script id="oils-category-groups-inline">(() => {
  'use strict';
  if (document.body.dataset.category !== 'oils') return;

  const GROUPS = [
    {
      key:'mustard',
      label:'Mustard Oil',
      short:'Mustard Oil',
      note:'Shama Mustard Oil in multiple retail pack sizes.'
    },
    {
      key:'sunflower',
      label:'Sunflower Oil',
      short:'Sunflower Oil',
      note:'Shama Sunflower Oil for retail and foodservice.'
    },
    {
      key:'coconut',
      label:'Coconut Oil',
      short:'Coconut Oil',
      note:'Shama Pure Natural Coconut Oil.'
    },
    {
      key:'specialty',
      label:'Specialty Oils',
      short:'Specialty Oils',
      note:'Sesame, black seed, almond and castor oils grouped together.'
    },
    {
      key:'hair',
      label:'Hair Oil',
      short:'Hair Oil',
      note:'Shama Amla Hair Oil.'
    },
    {
      key:'kewra',
      label:'Kewra Water',
      short:'Kewra Water',
      note:'Shama Kewra Water.'
    }
  ];

  function keyForTitle(title) {
    const value = String(title || '').trim();
    if (/mustard/i.test(value)) return 'mustard';
    if (/sunflower/i.test(value)) return 'sunflower';
    if (/coconut/i.test(value)) return 'coconut';
    if (/amla/i.test(value)) return 'hair';
    if (/kewra/i.test(value)) return 'kewra';
    return 'specialty';
  }

  function organise() {
    const wrap = document.querySelector('.simple-catalogue .wrap');
    const grid = wrap?.querySelector('#simple-product-grid');
    if (!wrap || !grid) return false;
    if (wrap.dataset.oilsGrouped === 'true') return true;

    const cards = Array.from(grid.querySelectorAll(':scope > .simple-product-card'));
    if (!cards.length) return false;

    const grouped = Object.fromEntries(GROUPS.map(group => [group.key, []]));

    cards.forEach(card => {
      const title = card.querySelector('.simple-product-content h3')?.textContent || '';
      const key = keyForTitle(title);
      grouped[key].push(card);
      card.dataset.oilGroup = key;

      const meta = card.querySelector('.simple-product-meta');
      if (meta) meta.textContent = 'Shama';
    });

    const controls = document.createElement('div');
    controls.className = 'rice-category-controls';
    controls.innerHTML = `
      <div class="rice-category-intro">
        <div>
          <span class="rice-category-kicker">Browse by category</span>
          <h2>Choose your oil range.</h2>
        </div>
        <p>Oils are separated by type so every range is easier to browse.</p>
      </div>
      <div class="rice-category-tabs" role="tablist" aria-label="Oil categories">
        <button class="rice-category-tab active" type="button" data-oil-filter="all" aria-pressed="true">
          <span>All Products</span><b>${cards.length}</b>
        </button>
        ${GROUPS.map(group => `
          <button class="rice-category-tab" type="button" data-oil-filter="${group.key}" aria-pressed="false">
            <span>${group.short}</span><b>${grouped[group.key].length}</b>
          </button>
        `).join('')}
      </div>
    `;

    const sections = document.createElement('div');
    sections.className = 'rice-category-sections';

    GROUPS.forEach((group,index) => {
      if (!grouped[group.key].length) return;

      const section = document.createElement('section');
      section.className = 'rice-category-section';
      section.dataset.oilSection = group.key;
      section.innerHTML = `
        <div class="rice-category-head">
          <div>
            <span class="rice-category-number">${String(index + 1).padStart(2,'0')}</span>
            <div>
              <span class="rice-category-label">Oil category</span>
              <h2>${group.label}</h2>
              <p>${group.note}</p>
            </div>
          </div>
          <span class="rice-category-count">${grouped[group.key].length} products</span>
        </div>
        <div class="simple-product-grid rice-category-grid"></div>
      `;

      const sectionGrid = section.querySelector('.rice-category-grid');
      grouped[group.key].forEach((card,cardIndex) => {
        const number = card.querySelector('.simple-product-index');
        if (number) number.textContent = String(cardIndex + 1).padStart(2,'0');
        sectionGrid.appendChild(card);
      });

      sections.appendChild(section);
    });

    grid.replaceWith(sections);
    wrap.prepend(controls);
    wrap.dataset.oilsGrouped = 'true';

    const tabs = Array.from(controls.querySelectorAll('[data-oil-filter]'));
    const allSections = Array.from(sections.querySelectorAll('[data-oil-section]'));

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const filter = tab.dataset.oilFilter;

        tabs.forEach(item => {
          const active = item === tab;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });

        allSections.forEach(section => {
          section.hidden = filter !== 'all' && section.dataset.oilSection !== filter;
        });

        const firstVisible = allSections.find(section => !section.hidden);
        if (firstVisible && filter !== 'all') {
          firstVisible.scrollIntoView({behavior:'smooth', block:'start'});
        }
      });
    });

    const heroCopy = document.querySelector('.page-hero p');
    if (heroCopy) {
      heroCopy.textContent = 'Browse Mustard, Sunflower, Coconut, Specialty and Hair Oils by category.';
    }

    return true;
  }

  function boot() {
    if (organise()) return;
    let attempts = 0;
    const timer = setInterval(() => {
      attempts += 1;
      if (organise() || attempts > 40) clearInterval(timer);
    }, 100);
  }

  boot();

  document.addEventListener('shama:product-simple-rendered', () => {
    const wrap = document.querySelector('.simple-catalogue .wrap');
    if (wrap) delete wrap.dataset.oilsGrouped;
    setTimeout(organise, 0);
  });
})();</script><script src="brand-categories-20260912.js?v=20260929-oilsgroups1"></script><script src="category-product-hero-video.js?v=20261002-static1"></script><script src="translation.js?v=20260909-safe1" defer></script><script id="shama-product-details-js" src="product-details-20260922.js?v=20260922-clickfix3"></script></body></html>
